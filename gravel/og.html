<!DOCTYPE html>
<!--
  Source HTML used to render /img/gravel-og.png (1200x630).
  Edit this and re-render with `pnpm exec playwright screenshot ...`
  from the mallet-app workspace. See scripts/build-gravel-og.mjs.
  Not linked from anywhere; safe to leave in /gravel/ for future tweaks.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gravel OG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fredoka:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      width: 1200px;
      height: 630px;
      font-family: 'DM Sans', system-ui, sans-serif;
      background: linear-gradient(180deg in oklab, #c5dce8 0%, #d6e7ef 40%, #e7f1f6 100%);
      color: #2D1810;
      overflow: hidden;
      position: relative;
    }
    .wrap {
      width: 100%;
      height: 100%;
      padding: 48px 64px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .top {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .logo-mark {
      width: 56px;
      height: 56px;
      color: #2D1810;
    }
    .brand {
      font-family: 'Fredoka', system-ui, sans-serif;
      font-weight: 600;
      font-size: 36px;
      letter-spacing: -0.02em;
      color: #2D1810;
    }
    .by {
      color: #6B5744;
      font-size: 18px;
      margin-left: 12px;
    }
    .artanis {
      height: 30px;
      width: auto;
      margin-left: 6px;
      opacity: 0.7;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      align-self: flex-start;
      background: rgba(155, 67, 64, 0.10);
      color: #9B4340;
      font-weight: 600;
      font-size: 18px;
      padding: 8px 16px;
      border-radius: 999px;
      margin-bottom: 24px;
    }
    .pill svg { width: 18px; height: 18px; }
    h1 {
      font-family: 'Fredoka', system-ui, sans-serif;
      font-weight: 600;
      font-size: 72px;
      line-height: 1.04;
      letter-spacing: -0.02em;
      margin: 0;
      max-width: 1040px;
    }
    h1 .accent { color: #9B4340; }
    .sub {
      color: #6B5744;
      font-size: 22px;
      margin-top: 20px;
      max-width: 820px;
      line-height: 1.4;
    }
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }
    .install {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      background: #1a1208;
      color: #F5EDE3;
      font-family: 'JetBrains Mono', monospace;
      font-size: 20px;
      padding: 16px 22px;
      border-radius: 14px;
      box-shadow: 0 16px 32px rgba(46, 24, 16, 0.18);
    }
    .install .dollar { color: #C4716A; }
    .install .cmd-dim { color: rgba(245, 237, 227, 0.5); }
    .badges {
      display: flex;
      align-items: center;
      gap: 24px;
      font-size: 18px;
      color: #4A7C59;
      font-weight: 500;
    }
    .badges svg { width: 18px; height: 18px; }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <svg class="logo-mark" viewBox="0 0 50 50" fill="currentColor" aria-hidden="true">

      </svg>
      <span class="brand">Gravel</span>
      <span class="by">by</span>
      <img class="artanis" src="/img/artanis.png" alt="Artanis">
    </div>

    <div>
      <span class="pill">
        <svg fill="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
        1-minute install · Open source
      </span>
      <h1>Cross-team prompt updates for <span class="accent">vertical</span> agents.</h1>
      <p class="sub">Embed an admin dashboard inside your AI app. Domain experts edit prompts (kept in your git) and review output without engineers in the loop.</p>
    </div>

    <div class="footer">
      <span class="install">
        <span class="dollar">$</span>
        <span><span class="cmd-dim">npx</span> @artanis-ai/gravel init</span>
      </span>
      <div class="badges">
        <span class="chip">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
          Free forever
        </span>
        <span class="chip">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
          Apache 2.0
        </span>
      </div>
    </div>
  </div>
</body>
</html>
