<!DOCTYPE html>
<!--
  Source HTML used to render /img/gravel-og.png (1200x630).
  Edit this and re-render with `node scripts/build-gravel-og.mjs`
  from the repo root. Preview via /gravel/og-preview.html.

  Three elements, sized for legibility at unfurl thumbnails:
    1. Brand: "Gravel" mark + wordmark, oversized.
    2. The page H1: "Cross-team prompt updates for vertical agents".
    3. One big browser-frame mockup whose URL bar says
       `your-app.com/admin/ai/...` — that single visual answers
       "what is this thing?". Inside, the dashboard's suggestion-edit
       view with a chunky inline diff.
  No bottom chip row, no "Powered by" lockup — three things only.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gravel OG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fredoka:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      width: 1200px;
      height: 630px;
      font-family: 'DM Sans', system-ui, sans-serif;
      background: linear-gradient(180deg in oklab, #c5dce8 0%, #d6e7ef 40%, #e7f1f6 100%);
      color: #2D1810;
      overflow: hidden;
    }
    .wrap {
      width: 100%;
      height: 100%;
      padding: 36px 44px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* 1. TOP: brand left, hero tagline right. Both huge. */
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 32px;
    }
    .brand-row {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .logo-mark {
      width: 84px;
      height: 84px;
      color: #2D1810;
    }
    .brand {
      font-family: 'Fredoka', system-ui, sans-serif;
      font-weight: 600;
      font-size: 84px;
      letter-spacing: -0.025em;
      color: #2D1810;
      line-height: 1;
    }
    .tagline {
      text-align: right;
      font-family: 'Fredoka', system-ui, sans-serif;
      font-weight: 600;
      font-size: 52px;
      line-height: 1.04;
      letter-spacing: -0.02em;
      color: #2D1810;
    }
    .tagline .accent { color: #9B4340; }

    /* 2. BROWSER FRAME — the entire "what is this" explanation. */
    .frame {
      flex: 1;
      background: #FFFBF5;
      border-radius: 18px;
      box-shadow: 0 28px 64px rgba(46, 24, 16, 0.22), 0 8px 18px rgba(46, 24, 16, 0.10);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    /* Chrome: traffic lights + URL bar. URL bar copy is critical —
       it's how the viewer realises the dashboard is mounted inside
       their own app, not hosted somewhere else. */
    .chrome {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 22px;
      background: #F0E6D8;
      border-bottom: 1px solid rgba(46, 24, 16, 0.08);
    }
    .dots { display: flex; gap: 8px; }
    .dot { width: 14px; height: 14px; border-radius: 999px; }
    .dot.r { background: #C97064; }
    .dot.y { background: #D4A76A; }
    .dot.g { background: #4A7C59; }
    .url-bar {
      flex: 1;
      background: #FFFBF5;
      border-radius: 11px;
      padding: 13px 20px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 28px;
      display: flex;
      align-items: center;
    }
    .url-bar .host {
      color: #9B4340;
      font-weight: 700;
    }
    .url-bar .path {
      color: #6B5744;
    }
    /* Embedded-app tab bar — segmented control pill, matches the
       real dashboard. */
    .tabs {
      display: flex;
      justify-content: center;
      padding: 16px 0 4px;
    }
    .tab-strip {
      display: inline-flex;
      gap: 6px;
      background: rgba(245, 237, 227, 0.85);
      padding: 7px;
      border-radius: 18px;
    }
    .tab {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      padding: 13px 26px;
      border-radius: 13px;
      font-size: 26px;
      font-weight: 600;
    }
    .tab.active {
      background: #FFFBF5;
      color: #2D1810;
      box-shadow: 0 0 0 1px #F0E6D8, 0 1px 2px rgba(46, 24, 16, 0.08);
    }
    .tab.inactive { color: #6B5744; }
    .tab svg { width: 26px; height: 26px; }

    /* The suggestion-editor body — white textarea, no header strip. */
    .doc {
      flex: 1;
      margin: 4px 32px 28px;
      background: #ffffff;
      border-radius: 14px;
      border: 1px solid #F0E6D8;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .editor {
      flex: 1;
      padding: 22px 28px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 32px;
      line-height: 1.45;
      color: #2D1810;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .sugg-ins {
      background: rgba(74, 124, 89, 0.22);
      text-decoration: underline;
      text-decoration-color: #4A7C59;
      text-decoration-thickness: 3px;
      text-underline-offset: 4px;
      border-radius: 3px;
      padding: 0 3px;
    }
    .sugg-del {
      color: rgba(155, 67, 64, 0.65);
      text-decoration: line-through;
      text-decoration-color: rgba(155, 67, 64, 0.55);
      text-decoration-thickness: 3px;
    }
    /* Blinking-style cursor caret. Sized to the text cap-height so
       its top aligns with capital letters and its bottom sits on
       the baseline — not floating, not buried. */
    .caret {
      display: inline-block;
      width: 3px;
      height: 0.85em;
      background: #9B4340;
      vertical-align: -0.05em;
      margin: 0 2px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- 1. Brand + tagline -->
    <div class="top">
      <div class="brand-row">
        <svg class="logo-mark" viewBox="0 0 50 50" fill="currentColor" aria-hidden="true">
          <path d="M 18 10 C 17.558631 10.000415 17.169721 10.290114 17.042969 10.712891 L 14.042969 20.712891 L 5.3496094 24.980469 C 3.8876094 25.896469 3 27.499609 3 29.224609 L 3 36 C 3 36.55 3.450218 37.015487 4 37 L 8.0839844 37 C 8.0839846 33.720944 10.742184 31.062744 14.02124 31.062744 C 16.914426 31.062753 19.386363 33.148146 19.873657 36 L 21.946411 36 L 29.587402 36 L 38.75 36 C 40.129 36 41.25 34.878 41.25 33.5 C 41.25 32.122 40.129 31 38.75 31 L 29.337402 31 C 29.98632 27.88257 32.092807 25.266399 35 23.967285 L 35 21 C 35 20.45 34.55 20 34 20 L 28 20 L 28 11 C 27.999945 10.447738 27.552262 10.000055 27 10 L 18 10 z M 39.045654 25.012085 A 8.0088444 8.0088444 0 0 0 32.044434 29.131958 L 39.130615 29.131958 C 41.414937 29.131958 43.271851 31.090182 43.271851 33.495239 C 43.271851 35.900296 41.414937 37.858521 39.130615 37.858521 L 32.662964 37.858521 A 8.0088444 8.0088444 0 0 0 39.045654 41.029663 A 8.0088444 8.0088444 0 0 0 47.054565 33.020874 A 8.0088444 8.0088444 0 0 0 39.045654 25.012085 z M 14.02124 33.089966 C 11.861775 33.089935 10.111175 34.840535 10.111206 37 C 10.111175 39.159465 11.861775 40.910065 14.02124 40.910034 C 16.180705 40.910065 17.931305 39.159465 17.931274 37 C 17.931305 34.840535 16.180705 33.089935 14.02124 33.089966 z" />
        </svg>
        <span class="brand">Gravel</span>
      </div>
      <div class="tagline">
        Cross-team prompt updates<br>for <span class="accent">vertical</span> agents
      </div>
    </div>

    <!-- 2. Browser frame: the entire visual explanation -->
    <div class="frame">
      <!-- Chrome — the URL bar is doing the heavy lifting. Bold red
           "your-app.com" makes the eye land on "this is YOUR app". -->
      <div class="chrome">
        <span class="dots"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></span>
        <div class="url-bar">
          <span class="host">your-app.com</span><span class="path">/admin/ai/prompts/triage.md</span>
        </div>
      </div>

      <!-- Segmented control tab bar -->
      <div class="tabs">
        <div class="tab-strip">
          <span class="tab active">
            <svg fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="14 3 14 9 20 9"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/></svg>
            Prompts
          </span>
          <span class="tab inactive">
            <svg fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h6"/><polyline points="14 3 14 9 20 9"/><circle cx="17" cy="17" r="3"/><line x1="19.2" y1="19.2" x2="22" y2="22"/></svg>
            Reviews
          </span>
        </div>
      </div>

      <!-- Suggestion-editor doc — just the diff, no header. -->
      <div class="doc">
        <div class="editor">
          <div>Be concise. Prioritise <span class="sugg-del">urgent</span><span class="sugg-ins">critical</span> symptoms.</div>
          <div>For patients over <span class="sugg-del">65</span><span class="sugg-ins">70</span>, lower the threshold</div>
          <div>for in-person care<span class="sugg-ins"> immediately</span>.<span class="caret"></span></div>
        </div>
      </div>
    </div>

  </div>
</body>
</html>
