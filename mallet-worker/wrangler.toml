name = "mallet-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Default (development) environment.
# Secrets must be set via `wrangler secret put` (or in .dev.vars for dev):
#   - OPENAI_API_KEY
#   - GITHUB_CLIENT_ID
#   - GITHUB_CLIENT_SECRET
#   - SESSION_SECRET (any long random string; used to sign session JWTs)
#   - AXIOM_TOKEN    (Axiom ingest token — OTel exporter bearer)
#   - GRAVEL_FORWARD_TOKEN (shared bearer for Gravel control-plane → Mallet
#     proxy; generate with `openssl rand -hex 32`. Same value must be set
#     as MALLET_FORWARD_TOKEN on the Vercel side.)
# Optional vars (set as plain vars, not secrets):
#   - GRAVEL_ANALYZE_RPM (per-org rate limit on /api/gravel/analyze; default 5)
[vars]
ENVIRONMENT = "development"
AXIOM_DATASET = "mallet-dev"
AXIOM_TRACES_URL = "https://api.axiom.co/v1/traces"

[[kv_namespaces]]
binding = "INVITES"
id = "c07e960ae5d64528a6e220b18c736ec4"

[[durable_objects.bindings]]
name = "SIGNALING_ROOM"
class_name = "SignalingRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SignalingRoom"]

# Production environment.
# Set secrets with:
#   wrangler secret put OPENAI_API_KEY --env production
#   wrangler secret put GITHUB_CLIENT_ID --env production
#   wrangler secret put GITHUB_CLIENT_SECRET --env production
#   wrangler secret put SESSION_SECRET --env production
#   wrangler secret put AXIOM_TOKEN --env production
#   wrangler secret put GRAVEL_FORWARD_TOKEN --env production
[env.production]
name = "mallet-api"

[env.production.vars]
ENVIRONMENT = "production"
AXIOM_DATASET = "mallet"
AXIOM_TRACES_URL = "https://api.axiom.co/v1/traces"

[[env.production.kv_namespaces]]
binding = "INVITES"
id = "5a2f239517a14fe2a76442fb6e0b0f00"

[[env.production.durable_objects.bindings]]
name = "SIGNALING_ROOM"
class_name = "SignalingRoom"
